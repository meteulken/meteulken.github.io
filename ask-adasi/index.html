<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{width:100%;height:100%;overflow:hidden;background:#ffd6e4;font-family:'Baloo 2',system-ui,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;color:#7a1f47;overscroll-behavior:none}
  canvas{display:block;touch-action:none}

  #hud{position:fixed;top:0;left:0;right:0;padding:10px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:3}
  #hudTop{display:flex;gap:8px;align-items:center;font-weight:800;font-size:clamp(14px,2.2vw,19px);flex-wrap:wrap;justify-content:center}
  .pill{background:rgba(255,255,255,.85);border-radius:999px;padding:2px 14px;box-shadow:0 2px 8px rgba(160,40,90,.15)}
  #time.low{color:#e0203f}
  #boost{background:#ffc93c;color:#7a3a00}
  #net{background:#6b5a7a;color:#fff}
  #meter{width:min(520px,80vw);height:22px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;position:relative;box-shadow:0 2px 8px rgba(160,40,90,.15)}
  #meterFill{height:100%;width:0;background:linear-gradient(90deg,#ff9cc0,#ff3d7f);transition:width .25s}
  #meterText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  #together{font-weight:800;font-size:16px;background:#ff3d7f;color:#fff;border-radius:999px;padding:1px 14px;opacity:0;transform:scale(.8);transition:.25s}
  #together.on{opacity:1;transform:scale(1)}
  @media (max-width:640px){ #hud{padding-top:58px} }

  #corner{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:8}
  #corner button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);font-size:20px;padding:0;margin:0;
    box-shadow:0 3px 0 rgba(160,40,90,.25);color:#7a1f47}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,190,215,.55);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:16px;z-index:10;touch-action:auto}
  .card{background:#fff;border-radius:28px;padding:24px 22px;max-width:470px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(160,40,90,.3);max-height:100%;overflow:auto;animation:cardIn .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes cardIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .card h1{font-size:clamp(30px,6vw,44px);line-height:1}
  .card h2{font-size:28px;line-height:1.1;margin-bottom:6px}
  .names{font-size:clamp(22px,4.5vw,30px);font-weight:800;margin:4px 0 8px}
  .cm{color:#3b7dd8}.cb{color:#e8457f}
  .card p{font-size:16px;line-height:1.35;margin-top:8px;font-weight:500}
  .card .msg{font-size:20px;font-weight:700;background:#fff0f5;border-radius:18px;padding:14px;margin-top:12px}
  .card .small{font-size:14px;opacity:.75}
  .big{font-size:52px;line-height:1}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;font-size:14px;line-height:1.3}
  .ctrl{border-radius:16px;padding:10px;background:#eef5ff}
  .ctrl.pink{background:#fff0f5}
  .ctrl b{font-size:18px;display:block}
  kbd{font-family:inherit;background:#fff;border-radius:6px;padding:0 6px;box-shadow:0 2px 0 rgba(0,0,0,.15);font-weight:700}
  .rules{text-align:left;font-size:15px;margin-top:10px;display:grid;gap:3px}
  .btns{display:flex;flex-direction:column;align-items:center}
  button{font-family:inherit;font-weight:800;font-size:20px;border:0;border-radius:999px;padding:10px 30px;
    background:linear-gradient(135deg,#ff7aa8,#ff3d7f);color:#fff;cursor:pointer;margin-top:16px;box-shadow:0 6px 0 #c42a60}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #c42a60}
  button.blue{background:linear-gradient(135deg,#7ab4ff,#3b7dd8);box-shadow:0 6px 0 #2a5ea8}
  button.sec{background:#fff;color:#e8457f;box-shadow:0 4px 0 #f3b6cc;font-size:16px;padding:7px 22px;margin-top:10px;border:2px solid #ffc2d8}
  button.voted{background:linear-gradient(135deg,#5fd18a,#2fae63);box-shadow:0 6px 0 #1f7d45;color:#fff;border-color:transparent}
  button .cnt{font-size:.8em;opacity:.9;margin-left:6px}
  .code{font-size:52px;letter-spacing:10px;font-weight:800;background:#fff0f5;border-radius:18px;margin:10px 0 0;padding:4px 0 0 10px}
  .link{word-break:break-all;user-select:text;-webkit-user-select:text}
  .join{display:flex;gap:8px;justify-content:center;align-items:flex-end;margin-top:6px}
  .join input{font-family:inherit;font-weight:800;font-size:24px;width:130px;text-align:center;text-transform:uppercase;letter-spacing:4px;
    border:3px solid #ffc2d8;border-radius:999px;padding:6px 10px;color:#7a1f47;outline:none}
  .join input:focus{border-color:#ff3d7f}
  .join button{margin-top:0}
  .or{margin-top:14px;font-size:14px;opacity:.6}
  #voteStatus{font-weight:700}

  .pop{position:fixed;font-weight:800;font-size:24px;pointer-events:none;z-index:5;white-space:nowrap;
    text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:pop .9s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    20%{opacity:1;transform:translate(-50%,-70%) scale(1.25)}
    100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
  #banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(30px,6vw,56px);font-weight:800;
    color:#fff;text-shadow:0 4px 0 #ff3d7f,0 0 20px rgba(255,61,127,.6);pointer-events:none;z-index:6;text-align:center;
    line-height:1.05;opacity:0;white-space:nowrap}
  #banner.show{animation:banner 2s ease forwards}
  @keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}

  .joy{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.3);border:3px solid rgba(255,255,255,.85);
    transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:4}
  .joy .knob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;margin:-25px 0 0 -25px;border:3px solid #fff}

<script type="module">
import * as THREE from 'three';

/* =========================================================
   KİŞİSELLEŞTİR — isimleri, bölümleri ve mesajları buradan değiştirin
   ========================================================= */
const NAMES = ['Mete', 'Bahar'];

const LEVELS = [
  { name: 'İlk Buluşma', target: 20, time: 60, spawn: 0.85, gold: 0, storm: 0,
    msg: 'Her şey bir bakışla başladı... O günden beri kalbim hep sana doğru atıyor. 💕' },
  { name: 'El Ele', target: 40, time: 60, spawn: 0.7, gold: 0.18, storm: 0,
    msg: 'Altın kalpleri ancak birlikte toplayabiliyoruz — tıpkı hayattaki en güzel şeyler gibi. ✨' },
  { name: 'Fırtınaya Rağmen', target: 55, time: 70, spawn: 0.6, gold: 0.15, storm: 3.0,
    msg: 'Kıskançlık bulutları gelse de gitse de, biz hep birbirimize döneriz. 🌈' },
];

const FINAL_MSG = 'Bu ada, bu kalpler ve bu oyun sadece ikimiz için.<br>Sonsuza dek birlikte. 💞';

const BOOST_TIME = 5;      // öpücük sonrası hız süresi (sn)
const BOOST_MUL = 1.7;     // hız çarpanı
const KISS_CD = 12;        // iki öpücük arası bekleme (sn)
/* ========================================================= */

const $ = id => document.getElementById(id);
const R = 9;
const SPEED = 6;
const TOGETHER_DIST = 2.6;
const KISS_DIST = 1.05;
const PEER_PREFIX = 'mete-bahar-askadasi-v1-';

// ---------- Renderer / sahne ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffd6e4);
scene.fog = new THREE.Fog(0xffd6e4, 40, 100);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const camBase = new THREE.Vector3();
let shake = 0;

function layout() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const k = THREE.MathUtils.clamp(1.25 / camera.aspect, 1, 2.8);
  camBase.set(0, 13.5 * k, 12.5 * k);
  camera.updateProjectionMatrix();
}
addEventListener('resize', layout);
layout();

scene.add(new THREE.HemisphereLight(0xfff0f5, 0xffa6c4, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(6, 14, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });
function mesh(geo, material, parent, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = shadow;
  if (parent) parent.add(m);
  return m;
}
function flatMesh(geo, material, parent, x, y, z) {
  const m = mesh(geo, material, parent, x, y, z, false);
  m.rotation.x = -Math.PI / 2;
  return m;
}
const r2 = v => Math.round(v * 100) / 100;

// ---------- Kalp geometrisi ----------
function heartGeo(size) {
  const s = new THREE.Shape();
  s.moveTo(5, 5);
  s.bezierCurveTo(5, 5, 4, 0, 0, 0);
  s.bezierCurveTo(-6, 0, -6, 7, -6, 7);
  s.bezierCurveTo(-6, 11, -3, 15.4, 5, 19);
  s.bezierCurveTo(12, 15.4, 16, 11, 16, 7);
  s.bezierCurveTo(16, 7, 16, 0, 10, 0);
  s.bezierCurveTo(7, 0, 5, 5, 5, 5);
  const g = new THREE.ExtrudeGeometry(s, { depth: 4, bevelEnabled: true, bevelSegments: 3, bevelSize: 1.5, bevelThickness: 1.5, curveSegments: 14 });
  g.center();
  g.rotateZ(Math.PI);
  const k = size / 21;
  g.scale(k, k, k);
  return g;
}
const HEART = heartGeo(0.9);
const HEART_BIG = heartGeo(1.5);
const HEART_TINY = heartGeo(0.32);
const HEART_BADGE = heartGeo(0.22);

// ---------- Ada ----------
const world = new THREE.Group();
scene.add(world);
const grass = mesh(new THREE.CylinderGeometry(R, R, 0.6, 56), M(0x9be38f, { flatShading: true }), world, 0, -0.3, 0, false);
grass.receiveShadow = true;
mesh(new THREE.TorusGeometry(R, 0.18, 8, 56), M(0x7fcf74), world, 0, 0, 0, false).rotation.x = Math.PI / 2;
mesh(new THREE.ConeGeometry(R * 0.98, 6, 12), M(0xd99a78, { flatShading: true }), world, 0, -3.6, 0, false).rotation.x = Math.PI;
mesh(new THREE.ConeGeometry(R * 0.6, 3.5, 10), M(0xc4825f, { flatShading: true }), world, 1.5, -6.8, 0.5, false).rotation.x = Math.PI;

function tree(x, z, s = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  mesh(new THREE.CylinderGeometry(0.15, 0.22, 1.4, 8), M(0x8a5a44), g, 0, 0.7, 0);
  const pink = M(0xffa3c7, { flatShading: true });
  const pink2 = M(0xff7fb0, { flatShading: true });
  mesh(new THREE.IcosahedronGeometry(0.9, 0), pink, g, 0, 1.9, 0);
  mesh(new THREE.IcosahedronGeometry(0.6, 0), pink2, g, 0.55, 1.6, 0.2);
  mesh(new THREE.IcosahedronGeometry(0.55, 0), pink, g, -0.5, 1.7, -0.2);
  world.add(g);
}
[[0.1, 0.9], [2.95, 1], [3.6, 0.85], [4.25, 1.1], [4.85, 0.9], [5.45, 1.05], [6.05, 0.8]].forEach(([a, s]) =>
  tree(Math.cos(a) * (R - 0.4), Math.sin(a) * (R - 0.4), s));

const flowerG = new THREE.IcosahedronGeometry(0.1, 0);
const flowerMats = [0xffffff, 0xff6fa3, 0xffd166, 0xc7a3ff].map(c => M(c));
for (let i = 0; i < 90; i++) {
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * (R - 0.5);
  mesh(flowerG, flowerMats[i % 4], world, Math.cos(a) * r, 0.06, Math.sin(a) * r, false);
}

const clouds = [];
const cloudMat = M(0xffffff, { roughness: 1 });
for (let i = 0; i < 7; i++) {
  const g = new THREE.Group();
  for (let j = 0; j < 4; j++) mesh(new THREE.SphereGeometry(1 + Math.random() * 0.8, 12, 10), cloudMat, g, j * 1.3 - 2, Math.random() * 0.5, Math.random() - 0.5, false);
  g.userData = { a: (i / 7) * Math.PI * 2, r: 16 + Math.random() * 8, y: -3 + Math.random() * 5, sp: 0.02 + Math.random() * 0.03 };
  scene.add(g);
  clouds.push(g);
}

const floaters = [];
for (let i = 0; i < 26; i++) {
  const m = new THREE.Mesh(HEART_TINY, new THREE.MeshBasicMaterial({ color: i % 2 ? 0xff8fb8 : 0xffffff, transparent: true, opacity: 0.6 }));
  const a = Math.random() * Math.PI * 2, r = 12 + Math.random() * 14;
  m.position.set(Math.cos(a) * r, -8 + Math.random() * 20, Math.sin(a) * r);
  m.scale.setScalar(1 + Math.random() * 2);
  m.userData.sp = 0.4 + Math.random() * 0.6;
  scene.add(m);
  floaters.push(m);
}

// ---------- Karakterler ----------
function label(text, color) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 80;
  const x = c.getContext('2d');
  x.font = '800 44px "Baloo 2", system-ui, sans-serif';
  const w = Math.min(248, x.measureText(text).width + 44);
  x.fillStyle = 'rgba(255,255,255,0.95)';
  x.beginPath();
  if (x.roundRect) x.roundRect((256 - w) / 2, 8, w, 62, 31); else x.rect((256 - w) / 2, 8, w, 62);
  x.fill();
  x.fillStyle = color;
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText(text, 128, 42);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  s.scale.set(1.5, 0.47, 1);
  s.renderOrder = 10;
  return s;
}

function makeChar(name, bodyColor, textColor, hairColor, girl) {
  const root = new THREE.Group();
  const model = new THREE.Group();
  root.add(model);
  const bodyM = M(bodyColor), skin = M(0xffdcc5), hairM = M(hairColor, { side: THREE.DoubleSide }), dark = M(0x2b1b24, { roughness: 0.4 });

  if (girl) {
    mesh(new THREE.ConeGeometry(0.5, 0.62, 20), bodyM, model, 0, 0.36, 0);
    mesh(new THREE.CapsuleGeometry(0.27, 0.35, 6, 14), bodyM, model, 0, 0.8, 0);
  } else {
    mesh(new THREE.CapsuleGeometry(0.34, 0.42, 6, 14), bodyM, model, 0, 0.6, 0);
  }
  mesh(HEART_BADGE, M(0xffffff), model, 0, 0.85, girl ? 0.27 : 0.33);

  const arms = [-1, 1].map(side => {
    const pivot = new THREE.Group();
    pivot.position.set(side * (girl ? 0.32 : 0.38), 1.0, 0);
    pivot.rotation.z = side * 0.25;
    mesh(new THREE.CapsuleGeometry(0.09, 0.3, 4, 8), bodyM, pivot, 0, -0.22, 0);
    model.add(pivot);
    return pivot;
  });

  mesh(new THREE.SphereGeometry(0.36, 24, 18), skin, model, 0, 1.38, 0);
  const eyeG = new THREE.SphereGeometry(0.05, 10, 8);
  mesh(eyeG, dark, model, -0.12, 1.41, 0.32);
  mesh(eyeG, dark, model, 0.12, 1.41, 0.32);
  const blushG = new THREE.SphereGeometry(0.06, 10, 8), blushM = M(0xff8fae);
  mesh(blushG, blushM, model, -0.21, 1.31, 0.28).scale.set(1, 0.6, 0.5);
  mesh(blushG, blushM, model, 0.21, 1.31, 0.28).scale.set(1, 0.6, 0.5);
  mesh(new THREE.TorusGeometry(0.06, 0.015, 6, 12, Math.PI), dark, model, 0, 1.3, 0.345).rotation.z = Math.PI;

  const cap = mesh(new THREE.SphereGeometry(0.39, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hairM, model, 0, 1.4, -0.02);
  cap.rotation.x = -0.45;
  if (girl) {
    mesh(new THREE.SphereGeometry(0.17, 14, 10), hairM, model, 0, 1.8, -0.2);
    mesh(new THREE.SphereGeometry(0.37, 16, 12), hairM, model, 0, 1.15, -0.2).scale.set(1.05, 1.25, 0.6);
    mesh(heartGeo(0.3), M(0xff3d7f), model, 0.27, 1.7, 0.05).rotation.z = -0.4;
  } else {
    mesh(new THREE.ConeGeometry(0.1, 0.25, 6), hairM, model, 0.05, 1.8, 0.1).rotation.z = -0.5;
  }

  // "sen" işareti (online) ve hız halkası
  const marker = flatMesh(new THREE.RingGeometry(0.5, 0.62, 32), new THREE.MeshBasicMaterial({ color: bodyColor, transparent: true, opacity: 0.8, depthWrite: false }), root, 0, 0.03, 0);
  marker.visible = false;
  const boostRing = flatMesh(new THREE.RingGeometry(0.62, 0.8, 32), new THREE.MeshBasicMaterial({ color: 0xffc93c, transparent: true, opacity: 0.9, depthWrite: false }), root, 0, 0.04, 0);
  boostRing.visible = false;

  const lab = label(name, textColor);
  lab.position.y = 2.3;
  root.add(lab);
  scene.add(root);
  return { root, model, arms, marker, boostRing };
}

const players = [
  { id: 0, css: '#3b7dd8', ch: makeChar(NAMES[0], 0x5b9bf0, '#3b7dd8', 0x4a2e22, false), start: new THREE.Vector3(-2.5, 0, 2) },
  { id: 1, css: '#e8457f', ch: makeChar(NAMES[1], 0xff7eb0, '#e8457f', 0x7a3b1f, true), start: new THREE.Vector3(2.5, 0, 2) },
];
function resetPlayers() {
  players.forEach(p => {
    p.ch.root.position.copy(p.start);
    p.ch.root.rotation.y = 0;
    p.ch.model.rotation.set(0, 0, 0);
    p.ch.model.visible = true;
    Object.assign(p, { stun: 0, stunF: false, boost: 0, walk: 0, trailT: 0,
      px: p.start.x, pz: p.start.z, tx: p.start.x, tz: p.start.z, tr: 0 });
  });
}
resetPlayers();

const linkHeart = mesh(HEART, M(0xff3d7f, { emissive: 0xff3d7f, emissiveIntensity: 0.4 }), scene, 0, 2.7, 0, false);
linkHeart.scale.setScalar(0);
const endHeart = mesh(HEART_BIG, M(0xff3d7f, { emissive: 0xff3d7f, emissiveIntensity: 0.5, roughness: 0.3 }), scene, 0, 2.2, 0.5, false);
endHeart.visible = false;

// ---------- Oyun durumu ----------
let mode = 'local';          // local | host | guest
let myChar = 0;
let state = 'menu';          // menu | lobby | play | pause | msg | end | lost
let level = 0, score = 0, timeLeft = 0, together = false;
let spawnT = 0, stormT = 0, nextId = 1;
let kissHold = 0, kissAnim = 0, kissCd = 0, kissing = false;
let votes = [null, null];
let currentCard = null;
const authority = () => mode !== 'guest';
const online = () => mode !== 'local';

// ---------- Kontroller ----------
const keys = {};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const keyVec = (u, d, l, r) => ({ x: (keys[r] ? 1 : 0) - (keys[l] ? 1 : 0), z: (keys[d] ? 1 : 0) - (keys[u] ? 1 : 0) });
const WASD = ['KeyW', 'KeyS', 'KeyA', 'KeyD'];
const ARROWS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

// dokunmatik joystick — aynı cihazda: sol yarı Mete, sağ yarı Bahar; online: tüm ekran
const joys = [0, 1].map(i => {
  const el = document.createElement('div');
  el.className = 'joy';
  const k = document.createElement('div');
  k.className = 'knob';
  el.appendChild(k);
  document.body.appendChild(el);
  return { el, k, id: null, ox: 0, oy: 0, x: 0, z: 0 };
});
function paintJoys() {
  joys.forEach((j, i) => { j.k.style.background = players[online() ? myChar : i].id ? '#ff7eb0' : '#5b9bf0'; });
}
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  const j = joys[online() ? 0 : (e.clientX < innerWidth / 2 ? 0 : 1)];
  if (j.id !== null) return;
  j.id = e.pointerId; j.ox = e.clientX; j.oy = e.clientY; j.x = j.z = 0;
  Object.assign(j.el.style, { left: e.clientX + 'px', top: e.clientY + 'px', display: 'block' });
  j.k.style.transform = '';
  try { cv.setPointerCapture(e.pointerId); } catch {}
});
cv.addEventListener('pointermove', e => {
  const j = joys.find(j => j.id === e.pointerId);
  if (!j) return;
  let dx = e.clientX - j.ox, dy = e.clientY - j.oy;
  const L = Math.hypot(dx, dy), MAX = 48;
  if (L > MAX) { dx *= MAX / L; dy *= MAX / L; }
  j.k.style.transform = `translate(${dx}px,${dy}px)`;
  j.x = dx / MAX; j.z = dy / MAX;
});
const endJoy = e => {
  const j = joys.find(j => j.id === e.pointerId);
  if (!j) return;
  j.id = null; j.x = j.z = 0;
  j.el.style.display = 'none';
};
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cv.addEventListener(ev, endJoy));

const remoteInput = { x: 0, z: 0 };
function myInput() {
  if (joys[0].id !== null) return { x: joys[0].x, z: joys[0].z };
  const a = keyVec(...WASD), b = keyVec(...ARROWS);
  return { x: THREE.MathUtils.clamp(a.x + b.x, -1, 1), z: THREE.MathUtils.clamp(a.z + b.z, -1, 1) };
}
function inputFor(id) {
  if (mode === 'local') {
    const j = joys[id];
    if (j.id !== null) return { x: j.x, z: j.z };
    return id === 0 ? keyVec(...WASD) : keyVec(...ARROWS);
  }
  return id === myChar ? myInput() : remoteInput;
}

// ---------- Ses ----------
let actx = null, muted = false;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch {}
  keepAwake();
}
function tone(f, t0, dur, type = 'sine', vol = 0.12, fEnd) {
  if (!actx || muted) return;
  const a = actx, now = a.currentTime + t0;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, now);
  if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, now + dur);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(vol, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g).connect(a.destination);
  o.start(now);
  o.stop(now + dur + 0.05);
}
const sfx = {
  pick: (x2) => { tone(880, 0, 0.12, 'triangle'); tone(x2 ? 1568 : 1320, 0.06, 0.16, 'triangle'); },
  gold: () => [660, 880, 1100, 1320, 1760].forEach((f, i) => tone(f, i * 0.07, 0.25, 'triangle', 0.1)),
  zap: () => { tone(300, 0, 0.35, 'sawtooth', 0.12, 50); tone(120, 0.05, 0.3, 'square', 0.06, 40); },
  warn: () => tone(520, 0, 0.1, 'sine', 0.05),
  kiss: () => { tone(900, 0, 0.12, 'sine', 0.15, 1800); tone(1000, 0.18, 0.12, 'sine', 0.15, 2000); },
  boost: () => { tone(400, 0, 0.4, 'triangle', 0.12, 1400); tone(600, 0.1, 0.4, 'triangle', 0.08, 2000); },
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.3, 'triangle', 0.12)),
  fail: () => [523, 440, 349].forEach((f, i) => tone(f, i * 0.2, 0.35, 'sine', 0.12)),
  click: () => tone(700, 0, 0.06, 'triangle', 0.08),
};
$('btnSound').onclick = () => { audio(); muted = !muted; $('btnSound').textContent = muted ? '🔇' : '🔊'; };

let wakeLock = null;
async function keepAwake() {
  try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (state !== 'menu') keepAwake();
  // telefon arka plana atınca sinyal sunucusu bağlantısı düşebilir; geri dönünce toparla
  try { if (peer && !peer.destroyed && peer.disconnected) peer.reconnect(); } catch {}
});

// ---------- Efektler ----------
const parts = [];
const PALETTES = [[0xff3d7f, 0xff8fb8, 0xffffff, 0xffc93c], [0xffc93c, 0xffffff, 0xff3d7f], [0xff3d7f, 0xff6fa3, 0xffffff]];
function burst(pos, n = 10, speed = 4, pal = 0) {
  const colors = PALETTES[pal];
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(HEART_TINY, new THREE.MeshBasicMaterial({ color: colors[i % colors.length], transparent: true }));
    m.position.set(pos[0], pos[1], pos[2]);
    const a = Math.random() * Math.PI * 2, up = Math.random();
    const v = new THREE.Vector3(Math.cos(a) * (1 - up * 0.5), 0.6 + up, Math.sin(a) * (1 - up * 0.5)).multiplyScalar(speed * (0.5 + Math.random() * 0.7));
    scene.add(m);
    parts.push({ m, v, life: 0.9 + Math.random() * 0.6, spin: (Math.random() - 0.5) * 10, g: 6 });
  }
}
function drift(x, y, z, color, vy, life, scale = 1) {
  const m = new THREE.Mesh(HEART_TINY, new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.position.set(x, y, z);
  m.scale.setScalar(scale);
  scene.add(m);
  parts.push({ m, v: new THREE.Vector3((Math.random() - 0.5) * 0.5, vy, (Math.random() - 0.5) * 0.5), life, spin: 0, g: 0 });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.v.y -= p.g * dt;
    p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.y += p.spin * dt;
    p.life -= dt;
    p.m.material.opacity = Math.min(1, p.life * 2);
    if (p.life <= 0) {
      scene.remove(p.m);
      p.m.material.dispose();
      parts.splice(i, 1);
    }
  }
}

const tmpV = new THREE.Vector3();
function popup(text, pos, color = '#ff3d7f', size = 24) {
  tmpV.set(pos[0], pos[1], pos[2]).project(camera);
  const d = document.createElement('div');
  d.className = 'pop';
  d.textContent = text;
  d.style.left = (tmpV.x * 0.5 + 0.5) * innerWidth + 'px';
  d.style.top = (-tmpV.y * 0.5 + 0.5) * innerHeight + 'px';
  d.style.color = color;
  d.style.fontSize = size + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 950);
}
function banner(html) {
  const b = $('banner');
  b.innerHTML = html;
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
}
const P3 = (v, y) => [r2(v.x), r2(y ?? v.y), r2(v.z)];

// Her iki cihazda aynı anda görünmesi gereken olaylar: host üretir, misafire gönderir
function emit(ev) {
  applyEvent(ev);
  if (mode === 'host' && conn && conn.open) conn.send({ t: 'ev', ev });
}
function applyEvent(ev) {
  switch (ev.e) {
    case 'pop': popup(ev.s, ev.p, ev.c, ev.z); break;
    case 'burst': burst(ev.p, ev.n, ev.v, ev.pal); break;
    case 'sfx': sfx[ev.n]?.(ev.a); break;
    case 'banner': banner(ev.h); break;
    case 'shake': shake = ev.v; break;
    case 'card': renderCard(ev.k, ev.d); break;
    case 'close': overlay.hidden = true; overlay.innerHTML = ''; break;
  }
}

// ---------- Düşen kalpler ----------
const items = [];
const heartMat = M(0xff3d7f, { roughness: 0.35, emissive: 0x661030, emissiveIntensity: 0.35 });
const goldMat = M(0xffc93c, { roughness: 0.25, metalness: 0.5, emissive: 0x805500, emissiveIntensity: 0.45 });
const shadowGeo = new THREE.CircleGeometry(0.45, 20);
const ringGeo = new THREE.RingGeometry(1.8, 2.05, 48);
const itemBase = it => it.gold ? 1.0 : 0.7;

function makeItemVisual(it) {
  it.m = mesh(it.gold ? HEART_BIG : HEART, it.gold ? goldMat : heartMat, scene, it.x, it.y, it.z);
  it.sh = flatMesh(shadowGeo, new THREE.MeshBasicMaterial({ color: 0x7a1f47, transparent: true, opacity: 0.2, depthWrite: false }), scene, it.x, 0.02, it.z);
  it.ring = it.gold ? flatMesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffb700, transparent: true, opacity: 0.6, depthWrite: false, side: THREE.DoubleSide }), scene, it.x, 0.04, it.z) : null;
}
function spawnHeart(gold) {
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * (R - 1.8);
  const it = { id: nextId++, gold, x: r2(Math.cos(a) * r), z: r2(Math.sin(a) * r), y: 13 + Math.random() * 3,
    vy: gold ? 2.6 : 3 + Math.random() * 2.5, landed: false, life: gold ? 6 : 2.6, spin: 1 + Math.random() * 2 };
  makeItemVisual(it);
  items.push(it);
}
function removeItem(i) {
  const it = items[i];
  scene.remove(it.m, it.sh);
  it.sh.material.dispose();
  if (it.ring) { scene.remove(it.ring); it.ring.material.dispose(); }
  items.splice(i, 1);
}
const dist2 = (pos, x, z) => Math.hypot(pos.x - x, pos.z - z);
const inGold = (p, it) => !p.stunF && dist2(p.ch.root.position, it.x, it.z) < 2.0;

function simItems(dt) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (!it.landed) {
      it.y -= it.vy * dt;
      if (it.y <= itemBase(it)) { it.y = itemBase(it); it.landed = true; }
    } else {
      it.life -= dt;
      if (it.life <= 0) { removeItem(i); continue; }
    }
    const pos = [it.x, it.y, it.z];
    if (it.gold) {
      if (it.y < 3.2 && inGold(players[0], it) && inGold(players[1], it)) {
        addScore(5, pos, '#e0a000', '+5 ✨');
        emit({ e: 'sfx', n: 'gold' });
        emit({ e: 'burst', p: pos, n: 22, v: 5, pal: 1 });
        removeItem(i);
      }
    } else if (it.y < 2.2) {
      for (const p of players) {
        if (p.stun > 0 || dist2(p.ch.root.position, it.x, it.z) >= 0.95) continue;
        const v = together ? 2 : 1;
        addScore(v, pos, p.css, '+' + v);
        emit({ e: 'sfx', n: 'pick', a: together });
        emit({ e: 'burst', p: pos, n: 8, v: 3.5, pal: 0 });
        removeItem(i);
        break;
      }
    }
  }
}
function visualItems(dt, t) {
  items.forEach((it, i) => {
    if (!authority() && !it.landed) it.y = Math.max(itemBase(it), it.y - it.vy * dt);
    it.m.rotation.y += dt * it.spin * (it.landed ? 1.6 : 1);
    it.m.position.y = it.landed ? itemBase(it) + Math.sin(t * 4 + it.id) * 0.12 : it.y;
    it.m.visible = !it.landed || it.life > 1 || Math.floor(t * 10) % 2 === 0;
    const s = THREE.MathUtils.clamp(1.3 - it.y / 12, 0.3, 1.3);
    it.sh.scale.setScalar(s * (it.gold ? 1.5 : 1));
    it.sh.material.opacity = 0.08 + 0.18 * (s / 1.3);
    if (it.ring) {
      const n = (inGold(players[0], it) ? 1 : 0) + (inGold(players[1], it) ? 1 : 0);
      it.ring.material.opacity = 0.35 + n * 0.3 + Math.sin(t * 8) * 0.1;
      it.ring.scale.setScalar(1 + Math.sin(t * 5) * 0.03);
    }
  });
}

// ---------- Kıskançlık bulutları ----------
const strikes = [];
const stormCloudMat = M(0x6b5a7a, { roughness: 1, flatShading: true });
const warnGeo = new THREE.RingGeometry(1.15, 1.4, 36);
const warnFillGeo = new THREE.CircleGeometry(1.4, 36);
const boltGeo = new THREE.CylinderGeometry(0.08, 0.18, 6, 6);
const boltMat = new THREE.MeshBasicMaterial({ color: 0xfff27a });

function makeStrikeVisual(s) {
  s.ring = flatMesh(warnGeo, new THREE.MeshBasicMaterial({ color: 0xff2255, transparent: true, depthWrite: false, side: THREE.DoubleSide }), scene, s.x, 0.05, s.z);
  s.fill = flatMesh(warnFillGeo, new THREE.MeshBasicMaterial({ color: 0xff2255, transparent: true, opacity: 0.15, depthWrite: false }), scene, s.x, 0.05, s.z);
  s.cloud = new THREE.Group();
  for (let j = 0; j < 4; j++) mesh(new THREE.IcosahedronGeometry(0.55 + Math.random() * 0.3, 0), stormCloudMat, s.cloud, (j - 1.5) * 0.6, Math.random() * 0.3, (Math.random() - 0.5) * 0.4, false);
  s.cloud.position.set(s.x, 6.5, s.z);
  s.cloud.scale.setScalar(0.01);
  scene.add(s.cloud);
  s.bolt = mesh(boltGeo, boltMat, scene, s.x, 3.3, s.z, false);
  s.bolt.visible = false;
}
function removeStrike(i) {
  const s = strikes[i];
  scene.remove(s.ring, s.fill, s.cloud, s.bolt);
  s.ring.material.dispose();
  s.fill.material.dispose();
  s.cloud.children.forEach(c => c.geometry.dispose());
  strikes.splice(i, 1);
}
function spawnStrike() {
  const target = players[Math.random() < 0.5 ? 0 : 1].ch.root.position;
  let x = target.x + (Math.random() - 0.5) * 2.5, z = target.z + (Math.random() - 0.5) * 2.5;
  const r = Math.hypot(x, z);
  if (r > R - 1) { x *= (R - 1) / r; z *= (R - 1) / r; }
  const s = { id: nextId++, x: r2(x), z: r2(z), t: 1.5, struck: false };
  makeStrikeVisual(s);
  strikes.push(s);
  emit({ e: 'sfx', n: 'warn' });
}
function simStrikes(dt) {
  for (let i = strikes.length - 1; i >= 0; i--) {
    const s = strikes[i];
    s.t -= dt;
    if (!s.struck && s.t <= 0.3) {
      s.struck = true;
      emit({ e: 'shake', v: 0.35 });
      emit({ e: 'sfx', n: 'zap' });
      for (const p of players) {
        if (p.stun <= 0 && dist2(p.ch.root.position, s.x, s.z) < 1.45) {
          p.stun = 1.4;
          score = Math.max(0, score - 3);
          emit({ e: 'pop', s: '-3 ⚡', p: P3(p.ch.root.position, 2.6), c: '#6b5a7a', z: 28 });
        }
      }
    }
    if (s.t <= -0.3) removeStrike(i);
  }
}
function visualStrikes(dt, t) {
  for (const s of strikes) {
    if (!authority()) s.t -= dt;
    s.cloud.scale.setScalar(THREE.MathUtils.lerp(s.cloud.scale.x, s.t > 0 ? 1 : 0.01, 1 - Math.exp(-6 * dt)));
    s.cloud.rotation.y += dt;
    s.ring.material.opacity = 0.5 + Math.sin(t * 20) * 0.4;
    s.bolt.visible = s.t <= 0.3 && s.t > 0.05 && Math.floor(t * 30) % 2 === 0;
  }
}
function clearField() {
  while (items.length) removeItem(items.length - 1);
  while (strikes.length) removeStrike(strikes.length - 1);
}

// ---------- Oyun akışı ----------
function addScore(v, pos, color, text) {
  score += v;
  emit({ e: 'pop', s: text, p: pos, c: color });
  if (state === 'play' && score >= LEVELS[level].target) levelComplete();
}

function showGameCard(k, d = {}) {
  currentCard = { k, d };
  emit({ e: 'card', k, d });
}

function startLevel(i) {
  level = i;
  const L = LEVELS[i];
  clearField();
  resetPlayers();
  score = 0;
  timeLeft = L.time;
  spawnT = 1.2;
  stormT = L.storm ? 4 : 0;
  kissHold = kissAnim = kissCd = 0;
  kissing = false;
  votes = [null, null];
  currentCard = null;
  state = 'play';
  emit({ e: 'close' });
  emit({ e: 'banner', h: `Bölüm ${i + 1}<br><span style="font-size:.6em">${L.name}</span>` });
  sendSnapshot();
}

function levelComplete() {
  state = 'msg';
  const lv = level, sc = score;
  clearField();
  emit({ e: 'sfx', n: 'win' });
  players.forEach(p => emit({ e: 'burst', p: P3(p.ch.root.position, 1.5), n: 25, v: 6, pal: 0 }));
  setTimeout(() => {
    if (state === 'msg' && level === lv) showGameCard('levelDone', { lv, sc });
  }, 1100);
}

function levelFail() {
  state = 'msg';
  clearField();
  emit({ e: 'sfx', n: 'fail' });
  showGameCard('fail', { lv: level, sc: score });
}

function startEnding() {
  state = 'end';
  clearField();
  votes = [null, null];
  currentCard = null;
  players.forEach(p => { p.stun = 0; p.boost = 0; });
  emit({ e: 'close' });
  emit({ e: 'banner', h: `${NAMES[0]} ❤ ${NAMES[1]}` });
  setTimeout(() => { if (state === 'end') showGameCard('final'); }, 3500);
}

function pauseGame() {
  if (state !== 'play') return;
  state = 'pause';
  showGameCard('pause');
}

// Onay gerektiren eylemler: online oyunda ikiniz de basınca çalışır
const IMMEDIATE = ['resume'];
function doAction(a) {
  if (!currentCard || !cardDef(currentCard.k, currentCard.d).btns.some(b => b[0] === a)) return;
  votes = [null, null];
  emit({ e: 'sfx', n: 'click' });
  switch (a) {
    case 'next': startLevel(level + 1); break;
    case 'retry': startLevel(level); break;
    case 'restart0': startLevel(0); break;
    case 'final': startEnding(); break;
    case 'resume': state = 'play'; currentCard = null; emit({ e: 'close' }); break;
  }
}
function vote(a, who) {
  if (IMMEDIATE.includes(a)) return doAction(a);
  votes[who] = votes[who] === a ? null : a;
  if (votes[0] && votes[0] === votes[1]) doAction(a);
  else { updateVoteUI(); sendSnapshot(); }
}
function requestAction(a) {
  audio();
  if (mode === 'local') return doAction(a);
  if (mode === 'host') return vote(a, myChar);
  if (conn && conn.open) conn.send({ t: 'vote', a });
  if (!IMMEDIATE.includes(a)) { votes[myChar] = votes[myChar] === a ? null : a; updateVoteUI(); }
}
$('btnRestart').onclick = () => {
  audio();
  if (mode === 'guest') { if (conn && conn.open) conn.send({ t: 'pause' }); }
  else pauseGame();
};

// ---------- Kartlar ----------
const overlay = $('overlay');
function showCard(html) {
  overlay.innerHTML = `<div class="card">${html}</div>`;
  overlay.hidden = false;
}
const who = i => `<b class="${i ? 'cb' : 'cm'}">${NAMES[i]}</b>`;

function cardDef(k, d = {}) {
  switch (k) {
    case 'ready': return {
      html: `<div class="big">💞</div><h2>Bağlandınız!</h2>
        <p>Sen: ${who(myChar)} · Sevgilin: ${who(1 - myChar)}</p>
        <p class="small">Beklerken adada birlikte dolaşabilirsiniz. İkiniz de <b>Hazırım</b>'a basınca oyun başlar.</p>`,
      btns: [['restart0', 'Hazırım 💕']] };
    case 'levelDone': {
      const last = d.lv === LEVELS.length - 1;
      return {
        html: `<div class="big">💌</div><h2>Bölüm ${d.lv + 1} tamam!</h2>
          <p class="msg">${LEVELS[d.lv].msg}</p><p class="small">Toplanan kalp: ${d.sc}</p>`,
        btns: last ? [['final', 'Final 💞'], ['retry', 'Bölümü Tekrarla', 'sec']]
                   : [['next', 'Sonraki Bölüm →'], ['retry', 'Bölümü Tekrarla', 'sec']] };
    }
    case 'fail': return {
      html: `<div class="big">🥺</div><h2>Süre doldu!</h2>
        <p>Aşk sabır ister. ${d.sc} / ${LEVELS[d.lv].target} kalp topladınız.<br>Bir daha deneyelim mi?</p>`,
      btns: [['retry', 'Tekrar Dene 💕'], ['restart0', 'Baştan Başla', 'sec']] };
    case 'final': return {
      html: `<div class="big">💞</div><h1>${who(0)} & ${who(1)}</h1><p class="msg">${FINAL_MSG}</p>`,
      btns: [['restart0', 'Baştan Oyna']] };
    case 'pause': return {
      html: `<div class="big">⏸️</div><h2>Oyun durdu</h2>`,
      btns: [['resume', '▶ Devam Et'], ['retry', '🔄 Bölümü Yeniden Başlat', 'sec'], ['restart0', '⏮ Baştan Başla', 'sec']] };
  }
}
function renderCard(k, d) {
  const def = cardDef(k, d);
  const hint = online() && def.btns.some(b => !IMMEDIATE.includes(b[0]))
    ? `<p class="small">Online oyunda ikiniz de aynı butona basınca başlar.</p><p id="voteStatus"></p>` : '';
  showCard(`${def.html}<div class="btns">${def.btns.map(([a, label, cls]) =>
    `<button data-a="${a}" data-label="${label}" class="${cls || ''}">${label}<span class="cnt"></span></button>`).join('')}</div>${hint}`);
  overlay.querySelectorAll('button[data-a]').forEach(b => { b.onclick = () => requestAction(b.dataset.a); });
  updateVoteUI();
}
function updateVoteUI() {
  if (!online() || overlay.hidden) return;
  overlay.querySelectorAll('button[data-a]').forEach(b => {
    const a = b.dataset.a;
    if (IMMEDIATE.includes(a)) return;
    const n = votes.filter(v => v === a).length;
    b.querySelector('.cnt').textContent = n ? `${n}/2` : '';
    const mine = votes[myChar] === a;
    b.classList.toggle('voted', mine);
    b.firstChild.textContent = mine ? '✓ ' + b.dataset.label : b.dataset.label;
  });
  const st = $('voteStatus');
  if (st) st.innerHTML = [0, 1].map(i => `${who(i)} ${votes[i] ? '✅ hazır' : '⏳ bekleniyor'}`).join(' · ');
}

// ---------- Ağ (PeerJS / WebRTC) ----------
let peer = null, conn = null, lastRecv = 0, gotHello = false, sendT = 0, inputT = 0, lastSentInput = '', attempt = 0;
const goHome = () => { try { peer && peer.destroy(); } catch {} location.href = location.pathname; };

// STUN: cihazların birbirini bulması (ücretsiz, hazır).
// TURN: ağ doğrudan bağlantıya izin vermezse trafiği aktaran yedek sunucu.
// Bağlantı kurulamıyorsa metered.ca'den ücretsiz TURN alıp aşağıya yapıştır:
//   TURN.push({ urls:'turn:....metered.ca:80', username:'...', credential:'...' });
const TURN = [];
const PEER_OPTS = {
  debug: 1,
  config: {
    iceServers: [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
      ...TURN,
    ],
  },
};
const HELP = `<br><span class="small">• İkinizin de interneti açık olmalı.<br>
  • Oda kuranın sayfası açık kalmalı (başka uygulamaya geçmeyin).<br>
  • Olmazsa biriniz Wi‑Fi yerine mobil veriye geçip yeni bir oda kurun.</span>`;
function setStatus(html) { const el = $('wStatus'); if (el) el.innerHTML = html; }

function makeCode() {
  const A = 'ABCDEFGHJKLMNPRSTUVYZ23456789';
  return Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join('');
}
function peerMissing() {
  if (typeof Peer !== 'undefined') return false;
  errorCard('Online bağlantı kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.');
  return true;
}
function errorCard(text) {
  if (state === 'lost') return;
  showCard(`<div class="big">😿</div><h2>Olmadı…</h2><p>${text}</p><div class="btns"><button id="bHome">Ana Menü</button></div>`);
  $('bHome').onclick = goHome;
}
function lost() {
  if (state === 'lost') return;
  if (mode === 'guest' && !gotHello) { errorCard('Bağlantı kurulamadı.'); return; }
  state = 'lost';
  clearField();
  showCard(`<div class="big">💔</div><h2>Bağlantı koptu</h2><p>Sevgilin oyundan çıktı ya da internet gitti.<br>Ana menüden yeni bir oda kurabilirsiniz.</p>
    <div class="btns"><button id="bHome">Ana Menü</button></div>`);
  $('bHome').onclick = goHome;
}

function createRoom(char) {
  if (peerMissing()) return;
  audio();
  mode = 'host';
  myChar = char;
  paintJoys();
  const code = makeCode();
  const link = location.origin + location.pathname + '?oda=' + code;
  showCard(`<div class="big">💌</div><h2>Oda hazırlanıyor</h2>
    <p>Sevgiline bu kodu ya da linki gönder:</p>
    <div class="code">${code}</div>
    <p class="small link">${link}</p>
    <div class="btns"><button id="bShare" disabled>Linki Paylaş 🔗</button>
    <button id="bCancel" class="sec">Vazgeç</button></div>
    <p class="small" id="wStatus">Oda kuruluyor… ⏳</p>
    <p class="small">⚠️ Sevgilin katılana kadar bu sayfayı <b>açık ve önde</b> tut.<br>Linki gönderdikten sonra hemen oyuna geri dön.</p>`);
  $('bCancel').onclick = goHome;
  $('bShare').onclick = async () => {
    const text = `${NAMES[myChar]} seni Aşk Adası'na çağırıyor 💘 Oda kodu: ${code}`;
    try {
      if (navigator.share) await navigator.share({ title: 'Aşk Adası', text, url: link });
      else { await navigator.clipboard.writeText(link); $('bShare').textContent = 'Kopyalandı ✓'; }
    } catch {}
  };

  peer = new Peer(PEER_PREFIX + code, PEER_OPTS);
  peer.on('open', () => {
    setStatus(`Oda açık, sevgilin bekleniyor… ⏳ (Sen: ${NAMES[myChar]})`);
    if ($('bShare')) $('bShare').disabled = false;
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); createRoom(char); return; }
    if (conn && conn.open) return;
    if (err.type === 'network' || err.type === 'socket-error' || err.type === 'server-error') {
      setStatus('Sunucuya ulaşılamıyor, tekrar deneniyor… ⏳');
      try { peer.reconnect(); } catch {}
      return;
    }
    errorCard('Oda kurulamadı (' + err.type + '). Biraz sonra tekrar dene.' + HELP);
  });
  peer.on('connection', c => {
    if (conn) { c.on('open', () => c.close()); return; }
    conn = c;
    c.on('open', () => {
      lastRecv = performance.now();
      c.send({ t: 'hello', you: 1 - myChar });
      resetPlayers();
      votes = [null, null];
      state = 'lobby';
      emit({ e: 'sfx', n: 'kiss' });
      showGameCard('ready');
      sendSnapshot();
    });
    c.on('data', onHostData);
    c.on('close', lost);
    c.on('error', lost);
  });
  peer.on('disconnected', () => { if (!(conn && conn.open)) try { peer.reconnect(); } catch {} });
}

const MAX_TRY = 4;
function joinRoom(code) {
  code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 4) { $('codeIn')?.focus(); return; }
  if (peerMissing()) return;
  audio();
  mode = 'guest';
  gotHello = false;
  attempt = 0;
  try { peer && peer.destroy(); } catch {}
  peer = null; conn = null;
  showCard(`<div class="big">💗</div><h2>Bağlanıyor…</h2><p>Oda: <b>${code}</b></p>
    <p class="small" id="wStatus">Sunucuya bağlanılıyor… ⏳</p>
    <p class="small">Oda kuranın sayfası açık olmalı. Bağlantı 10–15 saniye sürebilir.</p>
    <div class="btns"><button id="bRetry" class="sec">↻ Tekrar Dene</button><button id="bCancel" class="sec">Vazgeç</button></div>`);
  $('bCancel').onclick = goHome;
  $('bRetry').onclick = () => joinRoom(code);
  peer = new Peer(PEER_OPTS);
  peer.on('open', () => { setStatus('Oda aranıyor… 🔍'); tryConnect(code); });
  peer.on('error', err => {
    if (gotHello) return;
    if (err.type === 'peer-unavailable') {
      if (attempt < MAX_TRY) { setStatus(`Oda henüz açılmamış, tekrar deneniyor… (${attempt}/${MAX_TRY})`); setTimeout(() => tryConnect(code), 2500); }
      else errorCard(`<b>${code}</b> odası bulunamadı 🥺<br>Kodu kontrol et; oda kuranın sayfası açık olmalı.` + HELP);
    } else if (err.type === 'network' || err.type === 'socket-error' || err.type === 'server-error') {
      setStatus('Sunucuya ulaşılamıyor, tekrar deneniyor… ⏳');
    } else errorCard('Bağlanılamadı (' + err.type + ').' + HELP);
  });
}
function tryConnect(code) {
  if (!peer || peer.destroyed || gotHello) return;
  const n = ++attempt;
  setStatus(`Telefonlar bağlanıyor… (${n}. deneme) 📡`);
  const c = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
  conn = c;
  c.on('open', () => { if (conn === c) { lastRecv = performance.now(); setStatus('Bağlandı, oyun yükleniyor… 💞'); } });
  c.on('data', m => { if (conn === c) onGuestData(m); });
  c.on('close', () => { if (conn === c && gotHello) lost(); });
  c.on('error', () => {});
  setTimeout(() => {
    if (gotHello || conn !== c) return;
    try { c.close(); } catch {}
    if (attempt < MAX_TRY) tryConnect(code);
    else errorCard('Bağlantı kurulamadı 😿' + HELP);
  }, 10000);
}

function onHostData(m) {
  lastRecv = performance.now();
  switch (m.t) {
    case 'in': remoteInput.x = THREE.MathUtils.clamp(+m.x || 0, -1, 1); remoteInput.z = THREE.MathUtils.clamp(+m.z || 0, -1, 1); break;
    case 'vote': vote(m.a, 1 - myChar); break;
    case 'pause': pauseGame(); break;
  }
}
function onGuestData(m) {
  lastRecv = performance.now();
  switch (m.t) {
    case 'hello': gotHello = true; myChar = m.you; paintJoys(); break;
    case 's': applySnapshot(m); break;
    case 'ev': applyEvent(m.ev); break;
  }
}

function snapshot() {
  return {
    t: 's', st: state, lv: level, sc: score, tl: +timeLeft.toFixed(1), tg: together ? 1 : 0,
    kc: +kissCd.toFixed(1), ks: kissing ? 1 : 0, v: votes,
    p: players.map(p => { const r = p.ch.root; return [r2(r.position.x), r2(r.position.z), r2(r.rotation.y), p.stun > 0 ? 1 : 0, +p.boost.toFixed(1)]; }),
    i: items.map(it => [it.id, it.gold ? 1 : 0, it.x, it.z, r2(it.y), it.landed ? 1 : 0, +it.life.toFixed(1), r2(it.vy)]),
    k: strikes.map(s => [s.id, s.x, s.z, +s.t.toFixed(2)]),
  };
}
function sendSnapshot() {
  if (mode === 'host' && conn && conn.open) conn.send(snapshot());
}
function applySnapshot(s) {
  if (state === 'lost') return;
  const prevState = state;
  state = s.st; level = s.lv; score = s.sc; timeLeft = s.tl; together = !!s.tg;
  kissCd = s.kc; kissing = !!s.ks; votes = s.v;
  if (state === 'play' && prevState !== 'play') resetGuestPlayers(s.p);
  s.p.forEach((a, i) => {
    const p = players[i];
    p.tx = a[0]; p.tz = a[1]; p.tr = a[2]; p.stunF = !!a[3]; p.boost = a[4];
  });

  const seen = new Set();
  for (const a of s.i) {
    seen.add(a[0]);
    let it = items.find(x => x.id === a[0]);
    if (!it) {
      it = { id: a[0], gold: !!a[1], x: a[2], z: a[3], y: a[4], spin: 1 + Math.random() * 2 };
      makeItemVisual(it);
      items.push(it);
    }
    it.y = a[4]; it.landed = !!a[5]; it.life = a[6]; it.vy = a[7];
  }
  for (let i = items.length - 1; i >= 0; i--) if (!seen.has(items[i].id)) removeItem(i);

  const seenK = new Set();
  for (const a of s.k) {
    seenK.add(a[0]);
    let st = strikes.find(x => x.id === a[0]);
    if (!st) { st = { id: a[0], x: a[1], z: a[2], t: a[3] }; makeStrikeVisual(st); strikes.push(st); }
    st.t = a[3];
  }
  for (let i = strikes.length - 1; i >= 0; i--) if (!seenK.has(strikes[i].id)) removeStrike(i);
  updateVoteUI();
}
function resetGuestPlayers(ps) {
  // bölüm başında karakterler ışınlanır; misafirde kaymadan yerine otursun
  ps.forEach((a, i) => {
    const r = players[i].ch.root;
    if (Math.hypot(r.position.x - a[0], r.position.z - a[1]) > 2) {
      r.position.x = a[0]; r.position.z = a[1];
      players[i].px = a[0]; players[i].pz = a[1];
    }
  });
}

function netTick(dt) {
  if (!online() || !conn || !conn.open) return;
  if (mode === 'host') {
    sendT -= dt;
    if (sendT <= 0) { sendT = 1 / 15; sendSnapshot(); }
  } else {
    inputT -= dt;
    const inp = myInput();
    const key = inp.x.toFixed(2) + ',' + inp.z.toFixed(2);
    if ((key !== lastSentInput && inputT <= 0.2) || inputT <= 0) {
      inputT = 0.25;
      lastSentInput = key;
      conn.send({ t: 'in', x: +inp.x.toFixed(2), z: +inp.z.toFixed(2) });
    }
  }
  $('net').hidden = performance.now() - lastRecv < 2500 || state === 'lost';
}

// ---------- Simülasyon (host / aynı cihaz) ----------
function lerpAngle(a, b, t) {
  const d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  return a + d * t;
}

function simPlayers(dt) {
  const canMove = state === 'play' || state === 'msg' || state === 'lobby';
  for (const p of players) {
    const root = p.ch.root, pos = root.position;
    const v = inputFor(p.id);
    let len = Math.hypot(v.x, v.z);
    if (len > 1) { v.x /= len; v.z /= len; len = 1; }
    if (!canMove || kissAnim > 0) len = 0;
    if (p.stun > 0) { p.stun -= dt; len = 0; }
    p.stunF = p.stun > 0;
    if (state !== 'pause') p.boost = Math.max(0, p.boost - dt);

    if (len > 0.08) {
      const sp = SPEED * (p.boost > 0 ? BOOST_MUL : 1);
      pos.x += v.x * sp * dt;
      pos.z += v.z * sp * dt;
      root.rotation.y = lerpAngle(root.rotation.y, Math.atan2(v.x, v.z), 1 - Math.exp(-14 * dt));
    }
    const r = Math.hypot(pos.x, pos.z), maxR = R - 0.8;
    if (r > maxR) { pos.x *= maxR / r; pos.z *= maxR / r; }

    if (state === 'end') {
      const k = 1 - Math.exp(-3 * dt);
      pos.x = THREE.MathUtils.lerp(pos.x, p.id === 0 ? -0.55 : 0.55, k);
      pos.z = THREE.MathUtils.lerp(pos.z, 0.5, k);
      root.rotation.y = lerpAngle(root.rotation.y, p.id === 0 ? Math.PI / 2 : -Math.PI / 2, 1 - Math.exp(-5 * dt));
    }
  }

  const a = players[0].ch.root, b = players[1].ch.root;
  let dx = b.position.x - a.position.x, dz = b.position.z - a.position.z, d = Math.hypot(dx, dz);
  if (d < 0.75 && d > 1e-4 && state !== 'end') {
    const push = (0.75 - d) / 2, nx = dx / d, nz = dz / d;
    a.position.x -= nx * push; a.position.z -= nz * push;
    b.position.x += nx * push; b.position.z += nz * push;
  }
  together = d < TOGETHER_DIST && state === 'play';

  // 💋 öpücük → kısa süreli hız
  if (state === 'play') {
    kissCd = Math.max(0, kissCd - dt);
    if (kissAnim > 0) {
      kissAnim -= dt;
      const ang = Math.atan2(dx, dz), k = 1 - Math.exp(-12 * dt);
      a.rotation.y = lerpAngle(a.rotation.y, ang, k);
      b.rotation.y = lerpAngle(b.rotation.y, ang + Math.PI, k);
      if (kissAnim <= 0) {
        players.forEach(p => { p.boost = BOOST_TIME; });
        emit({ e: 'sfx', n: 'boost' });
        emit({ e: 'pop', s: `⚡ ${BOOST_TIME} sn hız!`, p: [r2((a.position.x + b.position.x) / 2), 2.4, r2((a.position.z + b.position.z) / 2)], c: '#e09000', z: 30 });
      }
    } else if (kissCd <= 0 && d < KISS_DIST && players[0].stun <= 0 && players[1].stun <= 0) {
      kissHold += dt;
      if (kissHold > 0.3) {
        kissHold = 0;
        kissAnim = 0.9;
        kissCd = KISS_CD;
        const mid = [r2((a.position.x + b.position.x) / 2), 1.6, r2((a.position.z + b.position.z) / 2)];
        emit({ e: 'sfx', n: 'kiss' });
        emit({ e: 'burst', p: mid, n: 26, v: 4, pal: 2 });
        emit({ e: 'pop', s: '💋', p: [mid[0], 2.2, mid[2]], c: '#ff3d7f', z: 44 });
      }
    } else kissHold = 0;
  } else {
    kissAnim = 0;
    kissHold = 0;
  }
  kissing = kissAnim > 0;
}

function simWorld(dt) {
  simPlayers(dt);
  if (state === 'play') {
    const L = LEVELS[level];
    timeLeft -= dt;
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = L.spawn * (0.7 + Math.random() * 0.6);
      spawnHeart(L.gold > 0 && Math.random() < L.gold && !items.some(it => it.gold));
    }
    if (L.storm) {
      stormT -= dt;
      if (stormT <= 0) { stormT = L.storm * (0.7 + Math.random() * 0.6); spawnStrike(); }
    }
    simItems(dt);
    simStrikes(dt);
    if (timeLeft <= 0 && state === 'play') levelFail();
  } else if (state !== 'pause') {
    simStrikes(dt);
  }
}

// ---------- Görsel güncelleme (tüm cihazlar) ----------
let prevVisState = '';
function visualPlayers(dt, t) {
  const k = 1 - Math.exp(-15 * dt);
  for (const p of players) {
    const { root, model, arms, marker, boostRing } = p.ch;
    const pos = root.position;
    if (!authority()) {
      pos.x += (p.tx - pos.x) * k;
      pos.z += (p.tz - pos.z) * k;
      root.rotation.y = lerpAngle(root.rotation.y, p.tr, k);
    }
    const moved = Math.hypot(pos.x - p.px, pos.z - p.pz);
    p.px = pos.x; p.pz = pos.z;
    const moving = moved > 0.5 * dt && moved < 1;
    if (moving) p.walk += moved * 2.2;
    else p.walk = THREE.MathUtils.lerp(p.walk, Math.round(p.walk / Math.PI) * Math.PI, 1 - Math.exp(-10 * dt));

    if (p.stunF) {
      model.rotation.y += dt * 14;
      model.visible = Math.floor(t * 16) % 2 === 0;
    } else {
      model.rotation.y = 0;
      model.visible = true;
    }
    const lean = kissing || state === 'end' ? 0.32 : 0;
    model.rotation.x = THREE.MathUtils.lerp(model.rotation.x, lean, 1 - Math.exp(-10 * dt));

    if (state === 'end') {
      model.position.y = Math.abs(Math.sin(t * 5 + p.id)) * 0.3;
      arms[0].rotation.set(0, 0, -2.6);
      arms[1].rotation.set(0, 0, 2.6);
    } else if (kissing) {
      model.position.y = 0;
      arms[0].rotation.set(-1.2, 0, -0.5);
      arms[1].rotation.set(-1.2, 0, 0.5);
    } else {
      model.position.y = Math.abs(Math.sin(p.walk)) * 0.15;
      arms[0].rotation.set(Math.sin(p.walk) * 0.7, 0, -0.25);
      arms[1].rotation.set(-Math.sin(p.walk) * 0.7, 0, 0.25);
    }
    model.scale.y = 1 + Math.sin(t * 3 + p.id * 2) * 0.02;

    marker.visible = online() && p.id === myChar && state !== 'menu';
    boostRing.visible = p.boost > 0;
    if (p.boost > 0) {
      boostRing.scale.setScalar(1 + Math.sin(t * 12) * 0.08);
      boostRing.rotation.z += dt * 3;
      p.trailT -= dt;
      if (moving && p.trailT <= 0) {
        p.trailT = 0.07;
        drift(pos.x + (Math.random() - 0.5) * 0.3, 0.3 + Math.random() * 0.4, pos.z + (Math.random() - 0.5) * 0.3, Math.random() < 0.5 ? 0xffc93c : 0xfff27a, 0.6, 0.5, 0.8);
      }
    }
  }
}

let linkT = 0, fireT = 0;
const hudCache = {};
function setText(id, text) { if (hudCache[id] !== text) { hudCache[id] = text; $(id).textContent = text; } }

function visualHud() {
  const showHud = state === 'play' || state === 'pause' || state === 'msg';
  $('hud').hidden = !showHud;
  $('btnRestart').hidden = state !== 'play';
  if (!showHud) return;
  const L = LEVELS[level];
  setText('lvl', `Bölüm ${level + 1} · ${L.name}`);
  const sec = Math.max(0, Math.ceil(timeLeft));
  setText('time', `⏱ ${sec}`);
  $('time').classList.toggle('low', sec <= 10);
  setText('meterText', `${score} / ${L.target} 💗`);
  const w = Math.min(100, (score / L.target) * 100).toFixed(1) + '%';
  if (hudCache.w !== w) { hudCache.w = w; $('meterFill').style.width = w; }
  setText('kiss', kissing ? '💋 Öpücük!' : kissCd > 0 ? `💋 ${Math.ceil(kissCd)}` : '💋 Hazır');
  const mine = online() ? players[myChar].boost : Math.max(players[0].boost, players[1].boost);
  $('boost').hidden = !(mine > 0);
  if (mine > 0) setText('boost', `⚡ Hız ${Math.ceil(mine)}`);
  $('together').classList.toggle('on', together);
}

function visualWorld(dt, t) {
  visualPlayers(dt, t);
  visualItems(dt, t);
  visualStrikes(dt, t);
  visualHud();

  const a = players[0].ch.root.position, b = players[1].ch.root.position;
  linkHeart.position.set((a.x + b.x) / 2, 2.7 + Math.sin(t * 3) * 0.1, (a.z + b.z) / 2);
  const ls = together ? 0.8 + Math.sin(t * 8) * 0.1 : 0;
  linkHeart.scale.setScalar(THREE.MathUtils.lerp(linkHeart.scale.x, ls, 1 - Math.exp(-10 * dt)));
  linkHeart.rotation.y += dt * 2;
  if (together) {
    linkT -= dt;
    if (linkT <= 0) { linkT = 0.35; drift(linkHeart.position.x, linkHeart.position.y, linkHeart.position.z, 0xff3d7f, 1.2, 1.2); }
  }

  if (state === 'end') {
    if (prevVisState !== 'end') { endHeart.visible = true; endHeart.scale.setScalar(0.01); endHeart.position.y = 2.2; fireT = 0; }
    endHeart.scale.setScalar(THREE.MathUtils.lerp(endHeart.scale.x, 1.2 + Math.sin(t * 6) * 0.12, 1 - Math.exp(-3 * dt)));
    endHeart.position.y = THREE.MathUtils.lerp(endHeart.position.y, 3.2, 1 - Math.exp(-2 * dt));
    endHeart.rotation.y = Math.sin(t) * 0.5;
    fireT -= dt;
    if (fireT <= 0) {
      fireT = 0.45;
      const ang = Math.random() * Math.PI * 2, rr = 2 + Math.random() * 4;
      burst([Math.cos(ang) * rr, 4 + Math.random() * 3, Math.sin(ang) * rr], 30, 6);
      tone(700 + Math.random() * 600, 0, 0.2, 'triangle', 0.05);
    }
  } else endHeart.visible = false;
  prevVisState = state;

  updateParts(dt);
  clouds.forEach(c => {
    c.userData.a += c.userData.sp * dt;
    c.position.set(Math.cos(c.userData.a) * c.userData.r, c.userData.y + Math.sin(t * 0.5 + c.userData.r) * 0.3, Math.sin(c.userData.a) * c.userData.r);
  });
  floaters.forEach(f => {
    f.position.y += f.userData.sp * dt;
    f.rotation.y += dt;
    if (f.position.y > 14) f.position.y = -8;
  });

  shake = Math.max(0, shake - dt);
  const sway = state === 'menu' ? Math.sin(t * 0.3) * 2 : 0;
  camera.position.set(camBase.x + sway + (Math.random() - 0.5) * shake, camBase.y + (Math.random() - 0.5) * shake, camBase.z);
  camera.lookAt(0, 0, 1);
}

// ---------- Ana döngü ----------
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (authority()) simWorld(dt);
  netTick(dt);
  visualWorld(dt, t);
  renderer.render(scene, camera);
}

// ---------- Menüler ----------
const touch = matchMedia('(pointer: coarse)').matches;
const RULES = `<div class="rules">
  <div>💗 Gökten düşen kalpleri birlikte toplayın.</div>
  <div>💞 Yan yana durursanız kalpler <b>2 kat</b> sayılır.</div>
  <div>💋 Birbirinize sokulun → öpücük → ikinize de <b>${BOOST_TIME} sn hız</b>!</div>
  <div>✨ <b>Altın kalp</b> için ikiniz de halkanın içinde olmalısınız.</div>
  <div>⛈️ Kırmızı halkadan kaçın, kıskançlık bulutu çarpar!</div>
</div>`;

function menuCard() {
  mode = 'local';
  state = 'menu';
  showCard(`<div class="big">💘</div>
    <h1>Aşk Adası</h1>
    <div class="names">${who(0)} 💞 ${who(1)}</div>
    ${RULES}
    <div class="btns">
      <button id="bOnline">📱📱 İki Telefonla Oyna</button>
      <button id="bLocal" class="sec">🖥️ Aynı Cihazda Oyna</button>
    </div>`);
  $('bOnline').onclick = () => { sfx.click(); onlineCard(); };
  $('bLocal').onclick = () => { audio(); localCard(); };
}

function localCard() {
  showCard(`<div class="big">🎮</div><h2>Aynı Cihazda</h2>
    <div class="controls">
      <div class="ctrl">${who(0)}${touch ? 'Ekranın <b style="display:inline;font-size:inherit">sol</b> yarısında sürükle' : '<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>'}</div>
      <div class="ctrl pink">${who(1)}${touch ? 'Ekranın <b style="display:inline;font-size:inherit">sağ</b> yarısında sürükle' : '<kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd>'}</div>
    </div>
    ${touch ? '<p class="small">📱 Telefonu yan çevirip birlikte tutun.</p>' : ''}
    <div class="btns"><button id="bGo">Oyuna Başla 💕</button><button id="bBack" class="sec">← Geri</button></div>`);
  $('bGo').onclick = () => { audio(); mode = 'local'; paintJoys(); startLevel(0); };
  $('bBack').onclick = menuCard;
}

function onlineCard(prefill = '') {
  showCard(`<div class="big">📱💞📱</div><h2>İki Telefonla Oyna</h2>
    <p>Biriniz oda kursun, diğeri kodu girsin ya da linke tıklasın.</p>
    <div class="btns">
      <button id="hA" class="blue">${NAMES[0]} olarak oda kur</button>
      <button id="hB">${NAMES[1]} olarak oda kur</button>
    </div>
    <p class="or">— ya da odaya katıl —</p>
    <div class="join"><input id="codeIn" maxlength="4" placeholder="KOD" autocomplete="off" autocapitalize="characters" value="${prefill}"><button id="bJoin">Katıl</button></div>
    <p class="small" style="margin-top:12px">${touch ? 'Ekranın herhangi bir yerinde parmağını sürükleyerek yürürsün.' : 'Kontroller: WASD ya da ok tuşları.'}</p>
    <div class="btns"><button id="bBack" class="sec">← Geri</button></div>`);
  $('hA').onclick = () => createRoom(0);
  $('hB').onclick = () => createRoom(1);
  $('bJoin').onclick = () => joinRoom($('codeIn').value);
  $('codeIn').onkeydown = e => { if (e.key === 'Enter') joinRoom($('codeIn').value); };
  $('bBack').onclick = menuCard;
}

function inviteCard(code) {
  showCard(`<div class="big">💌</div><h2>Bir davetin var!</h2>
    <p>Sevgilin seni Aşk Adası'na çağırıyor.</p>
    <div class="code">${code}</div>
    ${RULES}
    <div class="btns"><button id="bJoin">Katıl 💕</button><button id="bOther" class="sec">Ana Menü</button></div>`);
  $('bJoin').onclick = () => joinRoom(code);
  $('bOther').onclick = goHome;
}

const urlCode = (new URLSearchParams(location.search).get('oda') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
if (urlCode.length === 4) inviteCard(urlCode); else menuCard();
paintJoys();
loop();
</script>
